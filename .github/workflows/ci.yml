name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci
          POSTGRES_DB: erp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://erp:erp_ci@localhost:5432/erp_ci
      TEST_DATABASE_URL: postgresql://erp:erp_ci@localhost:5432/erp_test
      SESSION_SECRET: ci-only-secret-not-used-elsewhere
      STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar banco de testes
        run: PGPASSWORD=erp_ci psql -h localhost -U erp -d erp_ci -c "CREATE DATABASE erp_test"
      - name: Verificar migrações (aplicação em banco limpo)
        run: npx prisma migrate deploy
      - name: Verificar ausência de divergência entre schema e migrações
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$TEST_DATABASE_URL" --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Seed de demonstração (valida o ciclo completo)
        run: npm run db:seed
      - run: npm run build
      - name: Testes E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
