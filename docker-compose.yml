# Ambiente local. Credenciais abaixo são exclusivas do desenvolvimento local.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_local_dev
      POSTGRES_DB: erp_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://erp:erp_local_dev@db:5432/erp_dev
      SESSION_SECRET: dev-only-secret-change-me-0123456789abcdef
      APP_ENV: development
      APP_URL: http://localhost:3000
      STORAGE_DIR: /data/storage
    ports: ["3000:3000"]
    volumes: ["storage:/data/storage"]
  worker:
    build: .
    command: ["npm", "run", "worker"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://erp:erp_local_dev@db:5432/erp_dev
      SESSION_SECRET: dev-only-secret-change-me-0123456789abcdef
      APP_ENV: development
      STORAGE_DIR: /data/storage
    volumes: ["storage:/data/storage"]
volumes:
  pgdata:
  storage:
